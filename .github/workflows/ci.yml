name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "refactor/**", "security/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            lock-file: pylock.py312-linux.toml
          - python-version: "3.13"
            lock-file: pylock.py313-linux.toml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Format check
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy gitdock
      - name: Tests
        run: pytest
      - name: Compile check
        run: python -m compileall -q gitdock
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Secret scan
        run: |
          detect-secrets scan --all-files --exclude-files '(^|/)\.git/|(^|/)\.(mypy|pytest|ruff)_cache/|(^|/)(tests|docs)/|(^|/)\.env\.example$' > /tmp/secrets.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/secrets.json').read_text())
          results = data.get('results', {})
          if results:
              raise SystemExit(f"Potential secrets detected: {sorted(results)}")
          PY
      - name: Generate PEP 751 runtime lock
        run: python -m pip lock -r requirements.txt -o "${{ matrix.lock-file }}"
      - name: Upload runtime lock
        uses: actions/upload-artifact@v6
        with:
          name: runtime-lock-${{ matrix.python-version }}
          path: ${{ matrix.lock-file }}
          if-no-files-found: error
          retention-days: 3

  postgres-migration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gitdock
          POSTGRES_PASSWORD: gitdock_test  # pragma: allowlist secret
          POSTGRES_DB: gitdock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gitdock -d gitdock_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GITDOCK_DATABASE_URL: postgresql+asyncpg://gitdock:gitdock_test@127.0.0.1:5432/gitdock_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install runtime and migration dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Upgrade, downgrade, and re-upgrade PostgreSQL schema
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
